<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="旅行指南与实用资料索引，按添加日期从新到旧排列。">
  <meta name="theme-color" content="#f4f0e8">
  <title>Pages｜页面索引</title>
  <style>
    :root {
      --ink: #20231f;
      --muted: #6d726a;
      --paper: #f4f0e8;
      --card: #fffdf8;
      --line: #ddd7ca;
      --accent: #315c4b;
      --accent-soft: #dfeae3;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #d69a43; outline-offset: 4px; }

    .page {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 88px;
    }
    header { margin-bottom: 38px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: clamp(40px, 8vw, 68px);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: 1.05;
    }
    .intro { max-width: 590px; margin: 16px 0 0; color: var(--muted); }

    .list { display: grid; gap: 14px; }
    .card {
      display: grid;
      grid-template-columns: 172px minmax(0, 1fr) auto;
      gap: 22px;
      align-items: center;
      min-height: 132px;
      padding: 16px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #b7b2a7;
      box-shadow: 0 14px 34px rgba(45, 49, 43, .08);
    }
    .cover {
      width: 172px;
      height: 100px;
      object-fit: cover;
      background: var(--accent-soft);
      border-radius: 12px;
    }
    .cover.placeholder {
      display: grid;
      place-items: center;
      color: var(--accent);
      background: linear-gradient(135deg, #e4edf1, var(--accent-soft));
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -.04em;
    }
    .meta { min-width: 0; }
    h2 { margin: 0; font-size: 21px; line-height: 1.25; letter-spacing: -.025em; }
    .description { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    time { display: block; margin-top: 10px; color: var(--accent); font-size: 12px; font-weight: 750; }
    .arrow {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 50%;
      font-size: 18px;
      transition: transform .18s ease;
    }
    .card:hover .arrow { transform: translateX(3px); }
    footer { margin-top: 32px; color: var(--muted); font-size: 12px; }

    @media (max-width: 660px) {
      .page { width: min(100% - 28px, 920px); padding-top: 48px; }
      .card { grid-template-columns: 92px minmax(0, 1fr); gap: 14px; min-height: 118px; padding: 13px; }
      .cover { width: 92px; height: 88px; }
      .cover.placeholder { font-size: 24px; }
      h2 { font-size: 17px; }
      .description { display: none; }
      .arrow { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Pages</p>
      <h1>页面索引</h1>
      <p class="intro">这里收录旅行指南与实用资料，按添加日期从新到旧排列。</p>
    </header>

    <section class="list" aria-label="全部页面">
      <a class="card" href="angkor-2-vs-3-days.html">
        <img class="cover" src="assets/angkor/angkor-wat-sunrise.jpg" alt="吴哥窟日出">
        <div class="meta">
          <h2>吴哥窟 2 天 vs 3 天</h2>
          <p class="description">路线、景点取舍、门票与交通的行程对比指南。</p>
          <time datetime="2026-08-26T21:27:27-07:00">添加于 2026 年 8 月 26 日</time>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="card" href="glacier-many-glacier-trails.html">
        <img class="cover" src="assets/glacier/swiftcurrent-lake.jpg" alt="Many Glacier 山湖景色">
        <div class="meta">
          <h2>Many Glacier 三条经典路线</h2>
          <p class="description">Grinnell Glacier、Iceberg Lake 与 Ptarmigan Tunnel 徒步指南。</p>
          <time datetime="2026-08-26T00:56:09-07:00">添加于 2026 年 8 月 26 日</time>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="card" href="mexico-tr-pr.html">
        <div class="cover placeholder" role="img" aria-label="墨西哥 TR 到 PR">TR→PR</div>
        <div class="meta">
          <h2>墨西哥 TR → PR 流程图</h2>
          <p class="description">标准路线与 Los Cabos 分支的流程、节点和费用信息。</p>
          <time datetime="2026-08-06T19:30:10-07:00">添加于 2026 年 8 月 6 日</time>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <footer>共 3 个页面</footer>
  </main>
</body>
</html>
